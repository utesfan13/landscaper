# Uploads a release to Thunderstore.
#
# The mod can't be built here (it needs Valheim's game files), so build the zip locally with
#   dotnet build -c Release -t:Package
# which also copies it to release\Landscaper-<version>.zip. Commit that with the version, then publish a
# GitHub release tagged v<version> (for example v0.19.0); this workflow uploads the zip from the tagged
# commit, using the settings in thunderstore.toml. A Landscaper-<version>.zip attached to the release
# works too. It needs a THUNDERSTORETOKEN repository secret: a service account token from your
# Thunderstore team's settings.
#
# To retry an upload, run it from the Actions tab with the release's tag.

name: Publish to Thunderstore

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload (for example v0.19.0)
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # The workflow's own commit, for the current thunderstore.toml (a manual run uses main's), with
      # tags, to take the zip from the tagged commit.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Find the Thunderstore zip
        run: |
          version="${TAG#v}"
          zip="upload/Landscaper-$version.zip"
          mkdir -p upload
          if git cat-file -e "refs/tags/$TAG:release/Landscaper-$version.zip" 2>/dev/null; then
            git cat-file blob "refs/tags/$TAG:release/Landscaper-$version.zip" > "$zip"
          else
            echo "No release/Landscaper-$version.zip in the tagged commit; looking for one attached to the release."
            # Landscaper-<version>.zip; the Nexus zip ends in -nexus.zip and doesn't match.
            gh release download "$TAG" --pattern "Landscaper-$version.zip" --dir upload || true
          fi
          if [ ! -f "$zip" ]; then
            echo "::error::No Landscaper-$version.zip found. Build it (dotnet build -c Release -t:Package) and commit release/Landscaper-$version.zip, or attach it to the release, then re-run this workflow."
            exit 1
          fi
          echo "Using $zip"
          echo "ZIP=$zip" >> "$GITHUB_ENV"

      - name: Check the zip's version matches the tag
        run: |
          version=$(unzip -p "$ZIP" manifest.json | python3 -c "import json, sys; print(json.load(sys.stdin)['version_number'])")
          echo "Zip version $version, tag $TAG"
          if [ "v$version" != "$TAG" ] && [ "$version" != "$TAG" ]; then
            echo "::error::The zip is version $version but the release tag is $TAG."
            exit 1
          fi

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Upload to Thunderstore
        env:
          THUNDERSTORETOKEN: ${{ secrets.THUNDERSTORETOKEN }}
        run: |
          if [ -z "$THUNDERSTORETOKEN" ]; then
            echo "::error::Add a THUNDERSTORETOKEN repository secret first."
            exit 1
          fi
          dotnet tool install -g tcli
          tcli publish --file "$ZIP" --token "$THUNDERSTORETOKEN"
